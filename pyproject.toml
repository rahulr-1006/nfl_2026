[project]
name = "nfl-clv"
version = "0.1.0"
description = "NFL closing line value case study: leakage-free backtester, devig, CLV tracking"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "nflreadpy>=0.1.0",
    "apscheduler>=3.10",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
